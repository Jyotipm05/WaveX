name: CI

# Sized for GitHub's free hosted runners: Linux 2 vCPU / 7 GB RAM, no 10k-connection tests.
# Heavier work (sanitizers, benchmarks) lives in its own workflows so a PR check stays fast.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 500M

jobs:
  linux-gcc14:
    name: Linux / GCC 14 / Debug
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Distro RE2 instead of building RE2 + Abseil from source (see CMakeLists.txt).
      EXTRA_APT: libre2-dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache OpenSSL 3.5 and ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/openssl-3.5.4
            .ccache
          key: linux-gcc14-${{ hashFiles('.github/scripts/setup-linux.sh') }}-${{ github.sha }}
          restore-keys: |
            linux-gcc14-${{ hashFiles('.github/scripts/setup-linux.sh') }}-

      - name: Toolchain (CMake 4, OpenSSL 3.5)
        run: bash .github/scripts/setup-linux.sh

      - name: Generate TLS test certificate
        run: |
          mkdir -p ssl
          openssl req -x509 -newkey rsa:2048 -nodes -keyout ssl/test.key -out ssl/test.crt \
            -days 2 -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DWAVEX_TEST=ON -DWAVEX_USE_MODULE=OFF \
            -DOPENSSL_ROOT_DIR="$OPENSSL_PREFIX" -DOPENSSL_INCLUDE_DIR="$OPENSSL_PREFIX/include" \
            -DOPENSSL_CRYPTO_LIBRARY="$OPENSSL_PREFIX/lib/libcrypto.so" \
            -DOPENSSL_SSL_LIBRARY="$OPENSSL_PREFIX/lib/libssl.so"

      - name: Build
        id: build
        # On non-main branches, build failures are permitted and do not block the commit/pipeline
        continue-on-error: ${{ github.ref_name != 'main' && github.base_ref != 'main' }}
        run: cmake --build build -j2

      - name: Test
        id: test
        if: steps.build.outcome == 'success'
        # Strict on main or PRs targeting main; permissive on other branches
        continue-on-error: ${{ github.ref_name != 'main' && github.base_ref != 'main' }}
        env:
          LD_LIBRARY_PATH: ${{ env.OPENSSL_PREFIX }}/lib
        # Tests share loopback ports (RESOURCE_LOCK in CMakeLists.txt), so -j only overlaps startup/teardown.
        run: ctest --test-dir build --output-on-failure --timeout 120 -j2

      - name: Report CI summary
        if: always()
        run: |
          {
            echo "### CI Run Summary"
            echo "- **Target / Branch:** \`${{ github.ref_name }}\`"
            echo "- **Event:** \`${{ github.event_name }}\`"
            if [ "${{ github.base_ref }}" != "" ]; then
              echo "- **PR Base Branch:** \`${{ github.base_ref }}\`"
            fi
            if [ "${{ github.ref_name }}" = "main" ] || [ "${{ github.base_ref }}" = "main" ]; then
              echo "- **Policy:** 🔴 **Strict** (all tests must pass for main)"
            else
              echo "- **Policy:** 🟡 **Permissive** (all commits accepted on non-main branches)"
            fi
            if [ "${{ steps.test.outcome }}" = "failure" ]; then
              if [ "${{ github.ref_name }}" != "main" ] && [ "${{ github.base_ref }}" != "main" ]; then
                echo "⚠️ **Notice:** Tests failed on non-main branch, but commit was accepted per workflow policy."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: ccache stats
        if: always()
        run: ccache -s

  # Clang is built against libstdc++ here. Clang 18 reports __cpp_concepts 201907, which makes libstdc++ hide
  # std::expected, so Clang 20 (concepts 202002) is the oldest Clang this job can use.
  linux-clang20:
    name: Linux / Clang 20 / Debug
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # libre2-dev: use the distro RE2 instead of building RE2 + Abseil from source (see CMakeLists.txt).
      EXTRA_APT: clang-20 libre2-dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache OpenSSL 3.5 and ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/openssl-3.5.4
            .ccache
          key: linux-clang20-${{ hashFiles('.github/scripts/setup-linux.sh') }}-${{ github.sha }}
          restore-keys: |
            linux-clang20-${{ hashFiles('.github/scripts/setup-linux.sh') }}-

      - name: Toolchain (Clang 20, CMake 4, OpenSSL 3.5)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-20 clang-tools-20 lld-20
          sudo ln -sf /usr/bin/clang-scan-deps-20 /usr/bin/clang-scan-deps
          bash .github/scripts/setup-linux.sh

      - name: Generate TLS test certificate
        run: |
          mkdir -p ssl
          openssl req -x509 -newkey rsa:2048 -nodes -keyout ssl/test.key -out ssl/test.crt \
            -days 2 -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++-20 -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DWAVEX_TEST=ON -DWAVEX_USE_MODULE=OFF \
            -DOPENSSL_ROOT_DIR="$OPENSSL_PREFIX" -DOPENSSL_INCLUDE_DIR="$OPENSSL_PREFIX/include" \
            -DOPENSSL_CRYPTO_LIBRARY="$OPENSSL_PREFIX/lib/libcrypto.so" \
            -DOPENSSL_SSL_LIBRARY="$OPENSSL_PREFIX/lib/libssl.so" \
            -DCMAKE_CXX_COMPILER_CLANG_SCAN_DEPS=/usr/bin/clang-scan-deps-20

      - name: Build
        id: build
        continue-on-error: ${{ github.ref_name != 'main' && github.base_ref != 'main' }}
        run: cmake --build build -j2

      - name: Test
        id: test
        if: steps.build.outcome == 'success'
        continue-on-error: ${{ github.ref_name != 'main' && github.base_ref != 'main' }}
        env:
          LD_LIBRARY_PATH: ${{ env.OPENSSL_PREFIX }}/lib
        run: ctest --test-dir build --output-on-failure --timeout 120 -j2

      - name: ccache stats
        if: always()
        run: ccache -s
