name: Portability

# Informational checks for platforms the main CI does not cover (Windows / MSVC, macOS / Homebrew LLVM).
# They never gate a PR: manual run or weekly, and a failure does not fail the workflow (continue-on-error), so
# the result is read from the job log. Promote a job into ci.yml once it is green and stable.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 6"

concurrency:
  group: portability-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-msvc:
    name: Windows / MSVC / Debug
    runs-on: windows-2025
    timeout-minutes: 90
    continue-on-error: true
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # vcpkg builds OpenSSL, RE2 and Abseil from source on a cold cache (tens of minutes), so keep its binary cache.
      - name: Cache vcpkg binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vcpkg-cache
          key: windows-msvc-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: windows-msvc-vcpkg-

      - name: Prepare
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .vcpkg-cache, ssl | Out-Null
          openssl req -x509 -newkey rsa:2048 -nodes -keyout ssl/test.key -out ssl/test.crt -days 2 -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"

      # Modules are off here: the goal is "does it compile and pass on MSVC", not module build time.
      - name: Configure
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DWAVEX_TEST=ON -DWAVEX_USE_MODULE=OFF

      - name: Build
        run: cmake --build build --config Debug --parallel 2

      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure --timeout 120 -j2

  macos-llvm:
    name: macOS / Homebrew LLVM / Debug
    runs-on: macos-15
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        run: |
          brew install llvm openssl@3 re2 ninja
          mkdir -p ssl
          "$(brew --prefix openssl@3)/bin/openssl" req -x509 -newkey rsa:2048 -nodes -days 2 \
            -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -keyout ssl/test.key -out ssl/test.crt

      # Apple Clang's libc++ lags (std::expected, explicit object parameters), so use Homebrew LLVM with its own libc++.
      - name: Configure
        run: |
          LLVM="$(brew --prefix llvm)"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS_DEBUG=-g1 \
            -DCMAKE_CXX_COMPILER="$LLVM/bin/clang++" \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++ -nostdinc++ -isystem $LLVM/include/c++/v1" \
            -DCMAKE_EXE_LINKER_FLAGS="-L$LLVM/lib/c++ -Wl,-rpath,$LLVM/lib/c++" \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" -DCMAKE_PREFIX_PATH="$(brew --prefix)" \
            -DWAVEX_TEST=ON -DWAVEX_USE_MODULE=OFF

      - name: Build
        run: cmake --build build --parallel 3

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 120 -j3
