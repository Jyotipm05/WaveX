<svg id="eE3jHRNUDkM1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <style>
      /***************************************************
      * Pure CSS Behaviour (GitHub and Inline compatible):
      *  - First load: the draw-in intro plays once automatically via CSS.
      *  - Hover (when inline): replays the animation using duplicate
      *    keyframe names (since CSS only restarts animations when the
      *    animation-name changes) without needing JavaScript.
      **************************************************/

      /* ---------- Steady state and Autoplay on Load ---------- */
      svg .svg-elem-1 {
      fill: rgb(0, 0, 0); /* background: always visible, never animated */
      }
      svg .svg-elem-2 {
      stroke-dasharray: 567.5322875976562px;
      stroke-dashoffset: 0;
      fill: rgb(0, 0, 0);
      animation: dash-2 1s cubic-bezier(0.47, 0, 0.745, 0.715) 0.12s both,
      fill-2 0.7s cubic-bezier(0.47, 0, 0.745, 0.715) 0.9s both;
      }
      svg .svg-elem-3 {
      stroke-dasharray: 1508.4791259765625px;
      stroke-dashoffset: 0;
      animation: dash-3 1s cubic-bezier(0.47, 0, 0.745, 0.715) 0.24s both;
      }
      svg .svg-elem-4 {
      stroke-dasharray: 2002px;
      stroke-dashoffset: 0;
      fill: rgb(0, 0, 0);
      animation: dash-4 1s cubic-bezier(0.47, 0, 0.745, 0.715) 0.36s both,
      fill-4 0.7s cubic-bezier(0.47, 0, 0.745, 0.715) 1.1s both;
      }
      svg .svg-elem-5 {
      stroke-dasharray: 2003.23486328125px;
      stroke-dashoffset: 0;
      animation: dash-5 1s cubic-bezier(0.47, 0, 0.745, 0.715) 0.48s both;
      }

      /* ---------- Initial Load Keyframes ---------- */
      @keyframes dash-2 { from { stroke-dashoffset: 567.5322875976562px; } to { stroke-dashoffset: 0; } }
      @keyframes dash-3 { from { stroke-dashoffset: 1508.4791259765625px; } to { stroke-dashoffset: 0; } }
      @keyframes dash-4 { from { stroke-dashoffset: 2002px; } to { stroke-dashoffset: 0; } }
      @keyframes dash-5 { from { stroke-dashoffset: 2003.23486328125px; } to { stroke-dashoffset: 0; } }
      @keyframes fill-2 { from { fill: transparent; } to { fill: rgb(0, 0, 0); } }
      @keyframes fill-4 { from { fill: transparent; } to { fill: rgb(0, 0, 0); } }

      /* ---------- Hover Replay Keyframes (No-JS Trick) ---------- */
      @keyframes dash-2-hover { from { stroke-dashoffset: 567.5322875976562px; } to { stroke-dashoffset: 0; } }
      @keyframes dash-3-hover { from { stroke-dashoffset: 1508.4791259765625px; } to { stroke-dashoffset: 0; } }
      @keyframes dash-4-hover { from { stroke-dashoffset: 2002px; } to { stroke-dashoffset: 0; } }
      @keyframes dash-5-hover { from { stroke-dashoffset: 2003.23486328125px; } to { stroke-dashoffset: 0; } }
      @keyframes fill-2-hover { from { fill: transparent; } to { fill: rgb(0, 0, 0); } }
      @keyframes fill-4-hover { from { fill: transparent; } to { fill: rgb(0, 0, 0); } }

      /* ---------- Replay on Hover (works when inline/object) ---------- */
      svg:hover .svg-elem-2 {
      animation: dash-2-hover 1s cubic-bezier(0.47, 0, 0.745, 0.715) 0.12s both,
      fill-2-hover 0.7s cubic-bezier(0.47, 0, 0.745, 0.715) 0.9s both;
      }
      svg:hover .svg-elem-3 {
      animation: dash-3-hover 1s cubic-bezier(0.47, 0, 0.745, 0.715) 0.24s both;
      }
      svg:hover .svg-elem-4 {
      animation: dash-4-hover 1s cubic-bezier(0.47, 0, 0.745, 0.715) 0.36s both,
      fill-4-hover 0.7s cubic-bezier(0.47, 0, 0.745, 0.715) 1.1s both;
      }
      svg:hover .svg-elem-5 {
      animation: dash-5-hover 1s cubic-bezier(0.47, 0, 0.745, 0.715) 0.48s both;
      }
    </style>
    <clipPath id="eE3jHRNUDkM7">
      <path d="M0,0h500v500h-500L0,0Z" class="svg-elem-4" />
    </clipPath>
  </defs>
  <path d="M0,0h500v500h-500L0,0Z" fill="#00b4ff" class="svg-elem-1" />
  <g clip-path="url(#eE3jHRNUDkM7)">
    <g>
      <path d="M313.159928,-20.362048L480,520" stroke="#fff" stroke-width="40" stroke-linecap="square" class="svg-elem-2" />
      <path d="M-5,12c75.547607,0,44.531886,431.485457,109.899424,431.485457c74.000987,0,44.337323-347.636185,109.704862-347.636185c58.12514.578236,29.080086,309.168247,106.855384,309.168247c56.989539,0,107.801334-252.178709,175.882242-252.178709" transform="translate(2.658088 0)" fill="none" stroke="#00b4ff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" class="svg-elem-3" />
    </g>
  </g>
  <path d="M0,0h500l1.23335,500L0,500L0,0Z" fill="none" stroke="#000" stroke-width="12" class="svg-elem-5" />
</svg>