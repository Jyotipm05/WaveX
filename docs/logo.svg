<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 185 90" class="w-full h-auto">
  <defs>
    <linearGradient id="wavex-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" /> <!-- cyan-400 -->
      <stop offset="100%" stop-color="#0284c7" /> <!-- sky-600 -->
    </linearGradient>
  </defs>

  <g transform="translate(10, 10)">
    <!-- Waveform starting from Peak -->
    <path d="M 0 21 
             c 12 0, 24 48, 36 48 
             s 24 -48, 36 -48
             s 24 48, 36 48
             s 24 -48, 36 -48" 
          fill="none" stroke="url(#wavex-grad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- X Mark -->
    <path transform="translate(-15 0)" d="M 130 21 l 48 48 m 0 -48 l -48 48" 
          fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
